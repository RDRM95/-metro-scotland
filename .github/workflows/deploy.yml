name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    outputs:
      pages_actions: ${{ steps.configure.outcome }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Preferred path: Pages with "GitHub Actions" as the source.
      # If the repository's Pages site does not exist yet and the token may
      # not create it, this step fails softly and the gh-pages fallback runs.
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload build for branch fallback
        if: steps.configure.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy (GitHub Actions source)
    needs: build
    if: needs.build.outputs.pages_actions == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report
        run: |
          echo "Deployed METRO SCOTLAND to ${{ steps.deployment.outputs.page_url }}"
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Live at ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-branch:
    name: Deploy (gh-pages branch fallback)
    needs: build
    if: needs.build.outputs.pages_actions != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish dist/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Publish METRO SCOTLAND build'

      - name: Report
        run: |
          echo "Published to the gh-pages branch. GitHub serves it at https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "### Deployment (gh-pages branch)" >> "$GITHUB_STEP_SUMMARY"
          echo "Published to the gh-pages branch; served at https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
